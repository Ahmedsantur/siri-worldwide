openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Admin access operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/verify:
    post:
      operationId: verifyAdmin
      tags: [admin]
      summary: Verify an admin phone number
      description: Checks whether a phone number matches the configured admin phone secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyInput"
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminVerifyInput:
      type: object
      properties:
        phoneNumber:
          type: string
          minLength: 1
      required:
        - phoneNumber
    AdminAccess:
      type: object
      properties:
        authorized:
          type: boolean
        message:
          type: string
      required:
        - authorized
        - message

