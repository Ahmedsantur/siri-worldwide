name: Build SIRI APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd siri-worldwide && npm install && npm run build
      - run: cd siri-worldwide && npx cap add android || true
      - run: cd siri-worldwide && npx cap sync android
      - run: cd siri-worldwide/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SIRI-Worldwide-APK
          path: siri-worldwide/android/app/build/outputs/apk/debug/app-debug.apk
